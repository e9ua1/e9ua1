<svg viewBox="0 0 1200 200" width="1200" height="200" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="footer-title footer-desc">
  <title id="footer-title">Thanks for visiting</title>
  <desc id="footer-desc">Five colored worlds follow a quiet orbit through a deep star field and the afterglow of a spiral galaxy.</desc>

  <defs>
    <linearGradient id="f-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#03050d"/>
      <stop offset="48%" stop-color="#080b1d"/>
      <stop offset="100%" stop-color="#12092d"/>
    </linearGradient>
    <radialGradient id="f-nebula-cyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity=".24"/>
      <stop offset="58%" stop-color="#0ea5e9" stop-opacity=".08"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="f-nebula-violet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity=".34"/>
      <stop offset="56%" stop-color="#6366f1" stop-opacity=".12"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="f-orbit" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="24%" stop-color="#7dd3fc" stop-opacity=".38"/>
      <stop offset="52%" stop-color="#c4b5fd" stop-opacity=".58"/>
      <stop offset="78%" stop-color="#ec4899" stop-opacity=".34"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="f-arm-a" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="45%" stop-color="#c4b5fd" stop-opacity=".72"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="f-arm-b" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0"/>
      <stop offset="48%" stop-color="#7dd3fc" stop-opacity=".66"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="f-scrim" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#03050d" stop-opacity=".9"/>
      <stop offset="62%" stop-color="#03050d" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#03050d" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="f-clip">
      <rect width="1200" height="200" rx="24"/>
    </clipPath>
    <filter id="f-blur-xl" x="-35%" y="-100%" width="170%" height="300%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="f-blur-md" x="-50%" y="-100%" width="200%" height="300%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="f-glow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="f-text-shadow" x="-30%" y="-100%" width="160%" height="300%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#03050d" flood-opacity=".95"/>
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#6366f1" flood-opacity=".3"/>
    </filter>
  </defs>

  <style>
    @keyframes f-spin {
      to { transform: rotate(360deg); }
    }
    @keyframes f-twinkle {
      0%, 100% { opacity: .2; }
      50% { opacity: .9; }
    }
    @keyframes f-dash {
      to { stroke-dashoffset: -140; }
    }
    @keyframes f-breathe {
      0%, 100% { opacity: .52; }
      50% { opacity: .82; }
    }

    .f-origin {
      transform-box: fill-box;
      transform-origin: center;
    }
    .f-galaxy {
      animation: f-spin 110s linear infinite;
    }
    .f-star {
      animation: f-twinkle 6s ease-in-out infinite;
    }
    .f-orbit-line {
      animation: f-dash 30s linear infinite;
    }
    .f-afterglow {
      animation: f-breathe 7s ease-in-out infinite;
    }

    @media (prefers-reduced-motion: reduce) {
      .f-galaxy,
      .f-star,
      .f-orbit-line,
      .f-afterglow {
        animation: none !important;
      }
    }
  </style>

  <g clip-path="url(#f-clip)">
    <rect width="1200" height="200" fill="url(#f-bg)"/>

    <ellipse cx="130" cy="72" rx="300" ry="150" fill="url(#f-nebula-cyan)" filter="url(#f-blur-xl)"/>
    <ellipse class="f-afterglow" cx="1015" cy="188" rx="360" ry="170" fill="url(#f-nebula-violet)" filter="url(#f-blur-xl)"/>

    <g fill="#ffffff" opacity=".34">
      <circle cx="42" cy="42" r=".7"/>
      <circle cx="88" cy="151" r=".8"/>
      <circle cx="137" cy="91" r=".6"/>
      <circle cx="188" cy="28" r=".7"/>
      <circle cx="236" cy="168" r=".6"/>
      <circle cx="284" cy="61" r=".8"/>
      <circle cx="335" cy="135" r=".6"/>
      <circle cx="382" cy="31" r=".7"/>
      <circle cx="431" cy="174" r=".8"/>
      <circle cx="478" cy="74" r=".6"/>
      <circle cx="528" cy="143" r=".7"/>
      <circle cx="577" cy="24" r=".8"/>
      <circle cx="626" cy="165" r=".6"/>
      <circle cx="674" cy="55" r=".7"/>
      <circle cx="723" cy="131" r=".8"/>
      <circle cx="771" cy="29" r=".6"/>
      <circle cx="819" cy="172" r=".7"/>
      <circle cx="868" cy="67" r=".8"/>
      <circle cx="916" cy="143" r=".6"/>
      <circle cx="965" cy="27" r=".7"/>
      <circle cx="1014" cy="160" r=".8"/>
      <circle cx="1062" cy="54" r=".6"/>
      <circle cx="1110" cy="129" r=".7"/>
      <circle cx="1158" cy="32" r=".8"/>
    </g>

    <g fill="#ffffff">
      <circle class="f-star" cx="72" cy="104" r="1.3" style="animation-duration:5.4s"/>
      <circle class="f-star" cx="164" cy="46" r="1.05" style="animation-duration:6.8s;animation-delay:.8s" fill="#b9f6ff"/>
      <circle class="f-star" cx="259" cy="142" r="1.45" style="animation-duration:5.9s;animation-delay:1.7s"/>
      <circle class="f-star" cx="351" cy="82" r="1.1" style="animation-duration:7.2s;animation-delay:.4s" fill="#d8b4fe"/>
      <circle class="f-star" cx="456" cy="39" r="1.35" style="animation-duration:6.1s;animation-delay:2s"/>
      <circle class="f-star" cx="749" cy="43" r="1.2" style="animation-duration:5.6s;animation-delay:1.1s" fill="#b9f6ff"/>
      <circle class="f-star" cx="844" cy="151" r="1.4" style="animation-duration:7.4s;animation-delay:.6s"/>
      <circle class="f-star" cx="952" cy="62" r="1.1" style="animation-duration:6.3s;animation-delay:1.8s"/>
      <circle class="f-star" cx="1084" cy="145" r="1.5" style="animation-duration:5.7s;animation-delay:.3s" fill="#d8b4fe"/>
      <circle class="f-star" cx="1160" cy="76" r="1.1" style="animation-duration:6.9s;animation-delay:1.4s"/>
    </g>

    <path class="f-orbit-line" d="M-70 163C205 35 440 28 601 62S955 180 1270 54" fill="none" stroke="url(#f-orbit)" stroke-width="1.5" stroke-dasharray="5 14"/>
    <path d="M-80 183C213 73 432 62 602 90S962 196 1280 84" fill="none" stroke="#a855f7" stroke-opacity=".11" stroke-width="18" filter="url(#f-blur-md)"/>

    <g filter="url(#f-glow)">
      <circle cx="154" cy="102" r="4.2" fill="#ff4d4d"/>
      <circle cx="370" cy="57" r="4.2" fill="#a78bfa"/>
      <circle cx="600" cy="61" r="4.2" fill="#f59e0b"/>
      <circle cx="920" cy="129" r="4.2" fill="#6366f1"/>
      <circle cx="1048" cy="139" r="4.2" fill="#ec4899"/>
    </g>

    <g transform="translate(1080 208)">
      <g class="f-galaxy f-origin">
        <path d="M0 0C62-58 166-48 208 1C246 44 198 88 111 96C8 105-99 63-132 3C-161-52-96-101-5-106C97-110 190-67 210-11" fill="none" stroke="url(#f-arm-a)" stroke-width="10" stroke-linecap="round" opacity=".38" filter="url(#f-blur-md)"/>
        <path d="M0 0C62-58 166-48 208 1C246 44 198 88 111 96C8 105-99 63-132 3C-161-52-96-101-5-106C97-110 190-67 210-11" fill="none" stroke="url(#f-arm-a)" stroke-width="2.4" stroke-linecap="round" opacity=".74"/>
        <path d="M0 0C-57 57-157 49-198 7C-237-36-191-84-108-94C-8-106 97-65 131-5C161 49 98 99 6 105C-95 111-187 70-208 14" fill="none" stroke="url(#f-arm-b)" stroke-width="2.2" stroke-linecap="round" opacity=".66"/>
      </g>
      <ellipse rx="54" ry="30" fill="url(#f-nebula-cyan)" filter="url(#f-glow)"/>
      <circle r="5" fill="#ffffff"/>
    </g>

    <ellipse cx="600" cy="103" rx="300" ry="72" fill="url(#f-scrim)"/>
    <text x="600" y="116" text-anchor="middle" font-family="'Segoe UI', 'Trebuchet MS', Arial, sans-serif" font-size="46" font-weight="800" letter-spacing="3.8" fill="#ffffff" filter="url(#f-text-shadow)">THANKS FOR VISITING</text>
    <rect x="476" y="136" width="248" height="2" rx="1" fill="url(#f-orbit)" opacity=".8"/>

    <rect x=".75" y=".75" width="1198.5" height="198.5" rx="23.25" fill="none" stroke="#a78bfa" stroke-opacity=".22" stroke-width="1.5"/>
  </g>
</svg>
