<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="1200" height="200" role="img" aria-labelledby="f-title f-desc">
  <title id="f-title">Thanks for visiting</title>
  <desc id="f-desc">A quiet closing message among distant stars, with a delicate champagne and blue accretion-disk afterglow at the lower right edge.</desc>
  <defs>
    <linearGradient id="f-background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#040711"/>
      <stop offset=".6" stop-color="#070b16"/>
      <stop offset="1" stop-color="#10101d"/>
    </linearGradient>
    <radialGradient id="f-haze">
      <stop offset="0" stop-color="#aaa3d6" stop-opacity=".13"/>
      <stop offset=".5" stop-color="#9cbcd8" stop-opacity=".04"/>
      <stop offset="1" stop-color="#9cbcd8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="f-disk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9cbcd8" stop-opacity="0"/>
      <stop offset=".19" stop-color="#9cbcd8" stop-opacity=".24"/>
      <stop offset=".42" stop-color="#aaa3d6" stop-opacity=".62"/>
      <stop offset=".63" stop-color="#eed9b2" stop-opacity=".95"/>
      <stop offset=".8" stop-color="#b88c62" stop-opacity=".38"/>
      <stop offset="1" stop-color="#b88c62" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="f-rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9cbcd8" stop-opacity="0"/>
      <stop offset=".5" stop-color="#9cbcd8" stop-opacity=".42"/>
      <stop offset="1" stop-color="#9cbcd8" stop-opacity="0"/>
    </linearGradient>
    <filter id="f-soft" x="-25%" y="-150%" width="150%" height="400%">
      <feGaussianBlur stdDeviation="4.8"/>
    </filter>
    <filter id="f-fine" x="-15%" y="-50%" width="130%" height="200%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
    <clipPath id="f-frame"><rect width="1200" height="200" rx="24"/></clipPath>
  </defs>
  <style>
    @keyframes f-afterglow { 0%, 100% { opacity: .78; } 50% { opacity: .92; } }
    .f-afterglow { animation: f-afterglow 14s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { .f-afterglow { animation: none; } }
  </style>
  <g clip-path="url(#f-frame)">
    <rect width="1200" height="200" fill="url(#f-background)"/>
    <ellipse cx="1100" cy="195" rx="260" ry="136" fill="url(#f-haze)"/>
    <g fill="#9cbcd8" opacity=".34">
      <circle cx="61" cy="44" r=".65"/>
      <circle cx="134" cy="157" r=".7"/>
      <circle cx="199" cy="78" r=".5"/>
      <circle cx="267" cy="33" r=".6"/>
      <circle cx="348" cy="166" r=".55"/>
      <circle cx="408" cy="52" r=".5"/>
      <circle cx="509" cy="28" r=".6"/>
      <circle cx="644" cy="172" r=".55"/>
      <circle cx="712" cy="38" r=".65"/>
      <circle cx="792" cy="156" r=".55"/>
      <circle cx="863" cy="65" r=".6"/>
      <circle cx="941" cy="32" r=".5"/>
      <circle cx="989" cy="116" r=".65"/>
      <circle cx="1076" cy="41" r=".65"/>
      <circle cx="1152" cy="89" r=".5"/>
    </g>
    <g fill="#eef2f5">
      <circle cx="103" cy="107" r=".95" opacity=".58"/>
      <circle cx="312" cy="116" r=".8" opacity=".35"/>
      <circle cx="594" cy="48" r=".8" opacity=".48"/>
      <circle cx="891" cy="146" r=".9" opacity=".54"/>
      <circle cx="1117" cy="74" r=".9" opacity=".52"/>
    </g>
    <g class="f-afterglow" transform="translate(1058 215) rotate(-18)">
      <path d="M-170 0C-170-37-97-64 0-64S170-37 170 0" fill="none" stroke="url(#f-disk)" stroke-width="11" filter="url(#f-soft)" opacity=".36"/>
      <path d="M-170 0C-170-37-97-64 0-64S170-37 170 0" fill="none" stroke="url(#f-disk)" stroke-width="2.6" filter="url(#f-fine)" opacity=".65"/>
      <path d="M-170 0C-170-37-97-64 0-64S170-37 170 0" fill="none" stroke="url(#f-disk)" stroke-width=".85"/>
      <path d="M-154 2C-154-29-85-52 0-52S154-29 154 2" fill="none" stroke="url(#f-disk)" stroke-width=".55" opacity=".28"/>
      <path d="M-164 6C-141 40-56 58 23 54C87 51 135 35 158 15" fill="none" stroke="url(#f-disk)" stroke-width=".65" opacity=".3"/>
      <g fill="#eed9b2" opacity=".38">
        <circle cx="-102" cy="-49" r=".45"/>
        <circle cx="-79" cy="-53" r=".55"/>
        <circle cx="-39" cy="-64" r=".4"/>
        <circle cx="11" cy="-66" r=".6"/>
        <circle cx="53" cy="-62" r=".5"/>
        <circle cx="85" cy="-52" r=".45"/>
        <circle cx="114" cy="-45" r=".5"/>
        <circle cx="132" cy="-28" r=".4"/>
      </g>
    </g>
    <text x="600" y="108" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="36" font-weight="500" letter-spacing="5" fill="#e8edf2">THANKS FOR VISITING</text>
    <path d="M548 133H652" fill="none" stroke="url(#f-rule)" stroke-width=".7"/>
    <rect x=".5" y=".5" width="1199" height="199" rx="23.5" fill="none" stroke="#9cbcd8" stroke-opacity=".13"/>
  </g>
</svg>
