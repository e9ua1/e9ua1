<svg viewBox="0 0 360 240" width="360" height="240" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">Spiral Galaxy</title>
  <desc id="description">A luminous spiral galaxy with five colored labs orbiting its center.</desc>

  <defs>
    <radialGradient id="space" cx="50%" cy="46%" r="72%">
      <stop offset="0%" stop-color="#21104c"/>
      <stop offset="58%" stop-color="#0a0c1c"/>
      <stop offset="100%" stop-color="#05060e"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".98"/>
      <stop offset="18%" stop-color="#d9f7ff" stop-opacity=".92"/>
      <stop offset="48%" stop-color="#a855f7" stop-opacity=".58"/>
      <stop offset="78%" stop-color="#6366f1" stop-opacity=".2"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="armA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="42%" stop-color="#d9f7ff" stop-opacity=".88"/>
      <stop offset="72%" stop-color="#a855f7" stop-opacity=".72"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="armB" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="38%" stop-color="#8bdcff" stop-opacity=".68"/>
      <stop offset="68%" stop-color="#6366f1" stop-opacity=".82"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="nodeGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes drift {
      to { transform: rotate(360deg); }
    }
    @keyframes counterDrift {
      to { transform: rotate(-360deg); }
    }
    @keyframes breathe {
      0%, 100% { opacity: .72; transform: scale(.96); }
      50% { opacity: 1; transform: scale(1.04); }
    }
    @keyframes twinkle {
      0%, 100% { opacity: .22; }
      50% { opacity: 1; }
    }

    .origin {
      transform-box: fill-box;
      transform-origin: center;
    }
    .galaxy {
      animation: drift 38s linear infinite;
    }
    .orbit {
      animation: counterDrift 52s linear infinite;
    }
    .core {
      animation: breathe 4s ease-in-out infinite;
    }
    .star {
      animation: twinkle 3s ease-in-out infinite;
    }

    @media (prefers-reduced-motion: reduce) {
      .galaxy,
      .orbit,
      .core,
      .star {
        animation: none;
      }
    }
  </style>

  <rect width="360" height="240" rx="24" fill="url(#space)"/>
  <rect x=".75" y=".75" width="358.5" height="238.5" rx="23.25" fill="none" stroke="#a855f7" stroke-opacity=".3" stroke-width="1.5"/>

  <g fill="#ffffff">
    <circle class="star" cx="27" cy="38" r="1.3" style="animation-delay:.2s"/>
    <circle class="star" cx="63" cy="72" r=".9" style="animation-delay:1.1s"/>
    <circle class="star" cx="102" cy="27" r="1.1" style="animation-delay:.7s" fill="#d9f7ff"/>
    <circle class="star" cx="143" cy="49" r=".8" style="animation-delay:1.6s"/>
    <circle class="star" cx="219" cy="30" r="1.2" style="animation-delay:.4s" fill="#d9b8ff"/>
    <circle class="star" cx="265" cy="54" r=".8" style="animation-delay:1.3s"/>
    <circle class="star" cx="327" cy="35" r="1.4" style="animation-delay:.9s"/>
    <circle class="star" cx="337" cy="105" r=".9" style="animation-delay:1.9s"/>
    <circle class="star" cx="304" cy="155" r="1.1" style="animation-delay:.5s" fill="#d9f7ff"/>
    <circle class="star" cx="326" cy="205" r=".8" style="animation-delay:1.5s"/>
    <circle class="star" cx="250" cy="214" r="1.2" style="animation-delay:.1s"/>
    <circle class="star" cx="107" cy="211" r=".9" style="animation-delay:1.2s"/>
    <circle class="star" cx="42" cy="197" r="1.3" style="animation-delay:.6s" fill="#d9b8ff"/>
    <circle class="star" cx="22" cy="128" r=".8" style="animation-delay:1.7s"/>
  </g>

  <g class="galaxy origin">
    <ellipse cx="180" cy="112" rx="118" ry="40" fill="none" stroke="url(#armA)" stroke-width="10" stroke-linecap="round" transform="rotate(-17 180 112)"/>
    <ellipse cx="180" cy="112" rx="96" ry="30" fill="none" stroke="url(#armB)" stroke-width="8" stroke-linecap="round" transform="rotate(20 180 112)"/>
    <path d="M180 112c28-26 74-24 96 2 20 24 1 51-33 59-44 10-89-8-105-35-15-26 9-50 43-56 43-8 81 9 87 29" fill="none" stroke="url(#armA)" stroke-width="5" stroke-linecap="round"/>
    <path d="M180 112c-27 26-73 25-96 0-21-23-3-51 31-60 43-11 89 6 106 33 16 25-7 50-41 57-42 9-82-7-88-27" fill="none" stroke="url(#armB)" stroke-width="4" stroke-linecap="round"/>
  </g>

  <circle class="core origin" cx="180" cy="112" r="49" fill="url(#halo)" filter="url(#softGlow)"/>
  <circle cx="180" cy="112" r="12" fill="#ffffff"/>
  <circle cx="180" cy="112" r="5" fill="#d9f7ff"/>

  <g class="orbit origin">
    <ellipse cx="180" cy="112" rx="142" ry="76" fill="none" stroke="#c4b5fd" stroke-opacity=".2" stroke-width="1" stroke-dasharray="3 7"/>
    <g filter="url(#nodeGlow)">
      <circle cx="180" cy="36" r="5.5" fill="#ff4d4d"/>
      <circle cx="315" cy="89" r="5.5" fill="#a78bfa"/>
      <circle cx="264" cy="173" r="5.5" fill="#f59e0b"/>
      <circle cx="96" cy="173" r="5.5" fill="#6366f1"/>
      <circle cx="45" cy="89" r="5.5" fill="#ec4899"/>
    </g>
  </g>

  <text x="180" y="205" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="800" letter-spacing="3" fill="#ffffff">SPIRAL GALAXY</text>
  <text x="180" y="222" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="8.5" font-weight="600" letter-spacing="1.4" fill="#d9f7ff" opacity=".78">FIVE LABS · ONE UNIVERSE</text>
</svg>
