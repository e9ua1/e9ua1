<svg viewBox="0 0 1200 320" width="1200" height="320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="header-title header-desc">
  <title id="header-title">Hello, I'm IQ</title>
  <desc id="header-desc">A luminous spiral galaxy rises beside a clear welcome message in a deep, layered star field.</desc>

  <defs>
    <linearGradient id="h-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#03050d"/>
      <stop offset="45%" stop-color="#080b1d"/>
      <stop offset="72%" stop-color="#12092d"/>
      <stop offset="100%" stop-color="#05060e"/>
    </linearGradient>
    <radialGradient id="h-nebula-cyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity=".34"/>
      <stop offset="52%" stop-color="#0ea5e9" stop-opacity=".12"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="h-nebula-violet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity=".42"/>
      <stop offset="55%" stop-color="#6366f1" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="h-nebula-pink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity=".28"/>
      <stop offset="58%" stop-color="#db2777" stop-opacity=".1"/>
      <stop offset="100%" stop-color="#db2777" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="h-core" cx="45%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="16%" stop-color="#e9fbff"/>
      <stop offset="42%" stop-color="#b9f6ff"/>
      <stop offset="70%" stop-color="#a855f7" stop-opacity=".82"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="h-arm-a" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="26%" stop-color="#7dd3fc" stop-opacity=".82"/>
      <stop offset="58%" stop-color="#c4b5fd" stop-opacity=".96"/>
      <stop offset="82%" stop-color="#ec4899" stop-opacity=".62"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="h-arm-b" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0"/>
      <stop offset="30%" stop-color="#8b5cf6" stop-opacity=".7"/>
      <stop offset="62%" stop-color="#b9f6ff" stop-opacity=".88"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="h-scrim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#03050d" stop-opacity=".8"/>
      <stop offset="52%" stop-color="#03050d" stop-opacity=".58"/>
      <stop offset="100%" stop-color="#03050d" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="h-dust-lane" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#111827" stop-opacity="0"/>
      <stop offset="24%" stop-color="#1e1b4b" stop-opacity=".16"/>
      <stop offset="52%" stop-color="#0f1028" stop-opacity=".42"/>
      <stop offset="78%" stop-color="#312e81" stop-opacity=".14"/>
      <stop offset="100%" stop-color="#312e81" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="h-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="48%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="h-vignette" cx="54%" cy="50%" r="72%">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity=".56"/>
    </radialGradient>

    <clipPath id="h-clip">
      <rect width="1200" height="320" rx="26"/>
    </clipPath>
    <filter id="h-blur-xl" x="-30%" y="-80%" width="160%" height="260%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <filter id="h-blur-md" x="-40%" y="-80%" width="180%" height="260%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="h-dust-soft" x="-30%" y="-120%" width="160%" height="340%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
    <filter id="h-glow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="4.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="h-text-shadow" x="-30%" y="-80%" width="160%" height="260%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#03050d" flood-opacity=".95"/>
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#6366f1" flood-opacity=".34"/>
    </filter>
  </defs>

  <style>
    @keyframes h-spin {
      to { transform: rotate(360deg); }
    }
    @keyframes h-spin-back {
      to { transform: rotate(-360deg); }
    }
    @keyframes h-breathe {
      0%, 100% { opacity: .82; transform: scale(.98); }
      50% { opacity: 1; transform: scale(1.025); }
    }
    @keyframes h-twinkle {
      0%, 100% { opacity: .22; }
      50% { opacity: 1; }
    }
    @keyframes h-dash {
      to { stroke-dashoffset: -120; }
    }
    @keyframes h-type-main {
      0%, 4% {
        clip-path: inset(0 100% 0 0);
      }
      4.01% {
        clip-path: inset(0 100% 0 0);
        animation-timing-function: steps(13, end);
      }
      32%, 100% {
        clip-path: inset(0 0 0 0);
      }
    }
    @keyframes h-type-sub {
      0%, 36% {
        clip-path: inset(0 100% 0 0);
      }
      36.01% {
        clip-path: inset(0 100% 0 0);
        animation-timing-function: steps(16, end);
      }
      68%, 100% {
        clip-path: inset(0 0 0 0);
      }
    }
    @keyframes h-caret-main {
      0%, 4% {
        opacity: 0;
        transform: translateX(0);
      }
      4.01% {
        opacity: 1;
        transform: translateX(0);
        animation-timing-function: steps(13, end);
      }
      32% {
        opacity: 1;
        transform: translateX(336px);
      }
      32.01%, 100% {
        opacity: 0;
        transform: translateX(336px);
      }
    }
    @keyframes h-caret-sub {
      0%, 36% {
        opacity: 0;
        transform: translateX(0);
      }
      36.01% {
        opacity: 1;
        transform: translateX(0);
        animation-timing-function: steps(16, end);
      }
      68% {
        opacity: 1;
        transform: translateX(272px);
      }
      68.01%, 100% {
        opacity: 0;
        transform: translateX(272px);
      }
    }
    @keyframes h-caret-blink {
      0%, 48% { opacity: 1; }
      49%, 100% { opacity: 0; }
    }

    .h-origin {
      transform-box: fill-box;
      transform-origin: center;
    }
    .h-galaxy {
      animation: h-spin 82s linear infinite;
    }
    .h-orbit {
      animation: h-spin-back 105s linear infinite;
    }
    .h-core-pulse {
      animation: h-breathe 5.8s ease-in-out infinite;
    }
    .h-star {
      animation: h-twinkle 5s ease-in-out infinite;
    }
    .h-dust {
      animation: h-dash 24s linear infinite;
    }
    .h-type-main,
    .h-type-sub {
      clip-path: inset(0 0 0 0);
    }
    .h-type-main {
      animation: h-type-main 10s linear infinite;
    }
    .h-type-sub {
      animation: h-type-sub 10s linear infinite;
    }
    .h-caret-main-track {
      opacity: 0;
      animation: h-caret-main 10s linear infinite;
    }
    .h-caret-sub-track {
      opacity: 0;
      animation: h-caret-sub 10s linear infinite;
    }
    .h-caret-blink {
      animation: h-caret-blink .82s step-end infinite;
    }

    @media (prefers-reduced-motion: reduce) {
      .h-galaxy,
      .h-orbit,
      .h-core-pulse,
      .h-star,
      .h-dust {
        animation: none !important;
      }
      .h-type-main,
      .h-type-sub {
        animation: none !important;
        clip-path: inset(0 0 0 0) !important;
      }
      .h-caret-main-track,
      .h-caret-sub-track {
        display: none;
      }
    }
  </style>

  <g clip-path="url(#h-clip)">
    <rect width="1200" height="320" fill="url(#h-bg)"/>

    <ellipse cx="190" cy="42" rx="340" ry="180" fill="url(#h-nebula-cyan)" filter="url(#h-blur-xl)"/>
    <ellipse cx="875" cy="154" rx="390" ry="210" fill="url(#h-nebula-violet)" filter="url(#h-blur-xl)"/>
    <ellipse cx="1120" cy="286" rx="320" ry="150" fill="url(#h-nebula-pink)" filter="url(#h-blur-xl)"/>

    <path class="h-dust" d="M-80 278C180 205 365 270 560 225S940 72 1280 130" fill="none" stroke="#7dd3fc" stroke-opacity=".15" stroke-width="1.2" stroke-dasharray="4 16"/>
    <path d="M-60 294C180 235 390 296 610 244S1000 88 1270 176" fill="none" stroke="#a855f7" stroke-opacity=".11" stroke-width="22" filter="url(#h-blur-md)"/>
    <path d="M-80 65C165 112 292 48 480 88S765 213 1015 183S1210 114 1280 91" fill="none" stroke="#ec4899" stroke-opacity=".08" stroke-width="16" filter="url(#h-blur-md)"/>

    <g fill="#ffffff" opacity=".36">
      <circle cx="39" cy="64" r=".7"/>
      <circle cx="82" cy="242" r=".8"/>
      <circle cx="127" cy="111" r=".6"/>
      <circle cx="168" cy="286" r=".8"/>
      <circle cx="214" cy="201" r=".6"/>
      <circle cx="258" cy="31" r=".7"/>
      <circle cx="301" cy="259" r=".6"/>
      <circle cx="347" cy="79" r=".8"/>
      <circle cx="393" cy="292" r=".7"/>
      <circle cx="441" cy="43" r=".6"/>
      <circle cx="487" cy="245" r=".8"/>
      <circle cx="532" cy="94" r=".6"/>
      <circle cx="577" cy="289" r=".7"/>
      <circle cx="626" cy="36" r=".8"/>
      <circle cx="669" cy="221" r=".6"/>
      <circle cx="713" cy="75" r=".7"/>
      <circle cx="757" cy="285" r=".8"/>
      <circle cx="805" cy="34" r=".6"/>
      <circle cx="851" cy="258" r=".7"/>
      <circle cx="899" cy="62" r=".8"/>
      <circle cx="946" cy="292" r=".6"/>
      <circle cx="994" cy="31" r=".7"/>
      <circle cx="1037" cy="231" r=".8"/>
      <circle cx="1082" cy="77" r=".6"/>
      <circle cx="1127" cy="276" r=".7"/>
      <circle cx="1170" cy="118" r=".8"/>
    </g>

    <g fill="#ffffff">
      <circle class="h-star" cx="63" cy="174" r="1.6" style="animation-duration:5.6s"/>
      <circle class="h-star" cx="139" cy="52" r="1.15" style="animation-duration:6.8s;animation-delay:.7s" fill="#b9f6ff"/>
      <circle class="h-star" cx="226" cy="246" r="1.35" style="animation-duration:5.1s;animation-delay:1.5s"/>
      <circle class="h-star" cx="329" cy="126" r="1.1" style="animation-duration:7.2s;animation-delay:.4s" fill="#d8b4fe"/>
      <circle class="h-star" cx="462" cy="271" r="1.5" style="animation-duration:6.1s;animation-delay:2s"/>
      <circle class="h-star" cx="548" cy="52" r="1.2" style="animation-duration:5.4s;animation-delay:1.1s" fill="#b9f6ff"/>
      <circle class="h-star" cx="649" cy="250" r="1.4" style="animation-duration:7.5s;animation-delay:.9s"/>
      <circle class="h-star" cx="742" cy="44" r="1.05" style="animation-duration:6.4s;animation-delay:1.8s"/>
      <circle class="h-star" cx="835" cy="277" r="1.55" style="animation-duration:5.8s;animation-delay:.3s" fill="#d8b4fe"/>
      <circle class="h-star" cx="963" cy="48" r="1.2" style="animation-duration:7s;animation-delay:1.3s"/>
      <circle class="h-star" cx="1088" cy="223" r="1.5" style="animation-duration:5.3s;animation-delay:2.2s" fill="#b9f6ff"/>
      <circle class="h-star" cx="1161" cy="44" r="1.15" style="animation-duration:6.6s;animation-delay:.6s"/>
    </g>

    <g transform="translate(895 159)">
      <ellipse rx="312" ry="112" fill="url(#h-nebula-violet)" opacity=".68" filter="url(#h-blur-xl)"/>

      <g class="h-galaxy h-origin">
        <path d="M0 0C84-86 226-72 286-3C337 57 270 119 151 131C11 145-137 87-181 3C-220-73-132-141-7-146C133-151 260-93 288-14" fill="none" stroke="url(#h-arm-a)" stroke-width="15" stroke-linecap="round" opacity=".34" filter="url(#h-blur-md)"/>
        <path d="M0 0C84-86 226-72 286-3C337 57 270 119 151 131C11 145-137 87-181 3C-220-73-132-141-7-146C133-151 260-93 288-14" fill="none" stroke="url(#h-arm-a)" stroke-width="3.2" stroke-linecap="round" opacity=".88"/>
        <path d="M0 0C-76 82-215 71-271 9C-323-51-261-116-149-129C-13-144 132-89 179-5C219 70 132 138 8 145C-131 152-255 95-284 18" fill="none" stroke="url(#h-arm-b)" stroke-width="13" stroke-linecap="round" opacity=".3" filter="url(#h-blur-md)"/>
        <path d="M0 0C-76 82-215 71-271 9C-323-51-261-116-149-129C-13-144 132-89 179-5C219 70 132 138 8 145C-131 152-255 95-284 18" fill="none" stroke="url(#h-arm-b)" stroke-width="2.8" stroke-linecap="round" opacity=".82"/>
        <path d="M-210 40C-98 9 61-12 216-55" fill="none" stroke="url(#h-dust-lane)" stroke-width="8" stroke-linecap="round" filter="url(#h-dust-soft)"/>
      </g>

      <g class="h-orbit h-origin">
        <ellipse rx="272" ry="108" fill="none" stroke="#c4b5fd" stroke-opacity=".24" stroke-width="1" stroke-dasharray="3 10"/>
        <g filter="url(#h-glow)">
          <circle cx="0" cy="-108" r="4.8" fill="#ff4d4d"/>
          <circle cx="259" cy="-33" r="4.8" fill="#a78bfa"/>
          <circle cx="160" cy="87" r="4.8" fill="#f59e0b"/>
          <circle cx="-160" cy="87" r="4.8" fill="#6366f1"/>
          <circle cx="-259" cy="-33" r="4.8" fill="#ec4899"/>
        </g>
      </g>

      <ellipse class="h-core-pulse h-origin" rx="78" ry="48" fill="url(#h-core)" filter="url(#h-blur-md)"/>
      <ellipse rx="39" ry="22" fill="url(#h-core)" filter="url(#h-glow)"/>
      <circle r="6" fill="#ffffff"/>
    </g>

    <rect width="1200" height="320" fill="url(#h-vignette)"/>
    <rect width="720" height="320" fill="url(#h-scrim)"/>
    <g filter="url(#h-text-shadow)">
      <text class="h-type-main" x="104" y="145" font-family="'Segoe UI', 'Trebuchet MS', Arial, sans-serif" font-size="48" font-weight="800" letter-spacing="2.4" fill="#ffffff">HELLO, I'M IQ</text>
    </g>
    <g filter="url(#h-text-shadow)">
      <text class="h-type-sub" x="108" y="187" font-family="'Segoe UI', 'Trebuchet MS', Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="4" fill="#b9f6ff">NICE TO MEET YOU</text>
    </g>
    <g class="h-caret-main-track">
      <rect class="h-caret-blink" x="104" y="103" width="4" height="49" rx="1.5" fill="#b9f6ff" filter="url(#h-glow)"/>
    </g>
    <g class="h-caret-sub-track">
      <rect class="h-caret-blink" x="108" y="163" width="3" height="29" rx="1.5" fill="#b9f6ff" filter="url(#h-glow)"/>
    </g>
    <rect x="106" y="209" width="246" height="2.5" rx="1.25" fill="url(#h-accent)"/>

    <g transform="translate(106 231)" filter="url(#h-glow)">
      <circle cx="0" cy="0" r="2.6" fill="#ff4d4d"/>
      <circle cx="15" cy="0" r="2.6" fill="#a78bfa"/>
      <circle cx="30" cy="0" r="2.6" fill="#f59e0b"/>
      <circle cx="45" cy="0" r="2.6" fill="#6366f1"/>
      <circle cx="60" cy="0" r="2.6" fill="#ec4899"/>
    </g>

  </g>
</svg>
