<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="header-title header-description">
  <title id="header-title">Hello, I'm IQ — Nice to meet you</title>
  <desc id="header-description">A quiet welcome beside a quasar: an ink-dark center, a champagne and ice-blue accretion disk, and a restrained polar jet in deep space.</desc>
  <defs>
    <linearGradient id="h-space" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#040711"/>
      <stop offset=".55" stop-color="#070c18"/>
      <stop offset="1" stop-color="#0c0e20"/>
    </linearGradient>
    <radialGradient id="h-atmosphere">
      <stop stop-color="#77799f" stop-opacity=".2"/>
      <stop offset=".5" stop-color="#3d4d70" stop-opacity=".09"/>
      <stop offset="1" stop-color="#243756" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="h-corona">
      <stop stop-color="#eed9b2" stop-opacity=".26"/>
      <stop offset=".24" stop-color="#c9b5ae" stop-opacity=".13"/>
      <stop offset=".57" stop-color="#aaa3d6" stop-opacity=".07"/>
      <stop offset="1" stop-color="#9cbcd8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="h-disk" gradientUnits="userSpaceOnUse" x1="-235" y1="20" x2="235" y2="-15">
      <stop stop-color="#9cbcd8" stop-opacity="0"/>
      <stop offset=".14" stop-color="#9cbcd8" stop-opacity=".38"/>
      <stop offset=".39" stop-color="#d0c7bd" stop-opacity=".9"/>
      <stop offset=".56" stop-color="#fff0d7"/>
      <stop offset=".71" stop-color="#b88c62" stop-opacity=".67"/>
      <stop offset=".9" stop-color="#aaa3d6" stop-opacity=".28"/>
      <stop offset="1" stop-color="#aaa3d6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="h-lens" gradientUnits="userSpaceOnUse" x1="-80" y1="-10" x2="75" y2="-65">
      <stop stop-color="#9cbcd8" stop-opacity=".05"/>
      <stop offset=".35" stop-color="#c5c5d0" stop-opacity=".64"/>
      <stop offset=".58" stop-color="#eed9b2"/>
      <stop offset="1" stop-color="#b88c62" stop-opacity=".15"/>
    </linearGradient>
    <linearGradient id="h-jet" gradientUnits="userSpaceOnUse" x1="0" y1="-170" x2="0" y2="-15">
      <stop stop-color="#9cbcd8" stop-opacity="0"/>
      <stop offset=".45" stop-color="#9cbcd8" stop-opacity=".07"/>
      <stop offset=".85" stop-color="#b3ccd9" stop-opacity=".22"/>
      <stop offset="1" stop-color="#f4e3c6" stop-opacity=".4"/>
    </linearGradient>
    <linearGradient id="h-counterjet" gradientUnits="userSpaceOnUse" x1="0" y1="15" x2="0" y2="180">
      <stop stop-color="#eed9b2" stop-opacity=".24"/>
      <stop offset=".3" stop-color="#9cbcd8" stop-opacity=".09"/>
      <stop offset="1" stop-color="#9cbcd8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="h-horizon" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#d0c7bd" stop-opacity=".7"/>
      <stop offset=".46" stop-color="#eed9b2" stop-opacity=".13"/>
      <stop offset=".75" stop-color="#aaa3d6" stop-opacity=".35"/>
      <stop offset="1" stop-color="#9cbcd8" stop-opacity=".06"/>
    </linearGradient>
    <linearGradient id="h-text-field" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#040711" stop-opacity=".72"/>
      <stop offset=".5" stop-color="#040711" stop-opacity=".4"/>
      <stop offset=".78" stop-color="#040711" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="h-rule" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#eed9b2" stop-opacity=".65"/>
      <stop offset="1" stop-color="#9cbcd8" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="h-frame"><rect width="1200" height="320" rx="24"/></clipPath>
    <filter id="h-light" x="-30%" y="-60%" width="160%" height="220%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="h-feather" x="-15%" y="-30%" width="130%" height="160%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="h-dust" x="-8%" y="-20%" width="116%" height="140%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".02 .08" numOctaves="2" seed="14" result="grain"/>
      <feDisplacementMap in="SourceGraphic" in2="grain" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <style>
    @keyframes h-luminosity { 0%,100% {opacity:.86} 50% {opacity:1} }
    @keyframes h-jet-light { 0%,100% {opacity:.7} 50% {opacity:.88} }
    .h-disk-light {animation:h-luminosity 24s ease-in-out infinite}
    .h-polar-light {animation:h-jet-light 28s ease-in-out infinite}
    @media(prefers-reduced-motion:reduce) {.h-disk-light,.h-polar-light {animation:none}}
  </style>
  <g clip-path="url(#h-frame)">
    <rect width="1200" height="320" fill="url(#h-space)"/>
    <ellipse cx="956" cy="144" rx="394" ry="244" fill="url(#h-atmosphere)"/>
    <g fill="#c8d3e2" opacity=".3">
      <circle cx="38" cy="68" r=".7"/><circle cx="118" cy="38" r=".6"/><circle cx="208" cy="277" r=".8"/>
      <circle cx="312" cy="55" r=".65"/><circle cx="401" cy="31" r=".7"/><circle cx="472" cy="262" r=".65"/>
      <circle cx="552" cy="80" r=".8"/><circle cx="587" cy="234" r=".7"/><circle cx="643" cy="46" r=".6"/>
      <circle cx="699" cy="291" r=".8"/><circle cx="739" cy="74" r=".65"/><circle cx="761" cy="246" r=".6"/>
      <circle cx="812" cy="30" r=".7"/><circle cx="874" cy="279" r=".65"/><circle cx="904" cy="60" r=".55"/>
      <circle cx="1010" cy="33" r=".65"/><circle cx="1049" cy="275" r=".7"/><circle cx="1118" cy="55" r=".8"/>
      <circle cx="1160" cy="225" r=".65"/><circle cx="1138" cy="297" r=".65"/><circle cx="665" cy="180" r=".55"/>
      <circle cx="490" cy="40" r=".55"/><circle cx="354" cy="286" r=".55"/><circle cx="1098" cy="202" r=".65"/>
    </g>
    <g fill="#e0e5ee">
      <circle cx="61" cy="242" r=".9" opacity=".45"/><circle cx="681" cy="93" r="1" opacity=".5"/>
      <circle cx="1116" cy="105" r="1.1" opacity=".5"/><circle cx="807" cy="276" r=".95" opacity=".48"/>
      <circle cx="1042" cy="55" r=".9" opacity=".42"/><circle cx="580" cy="32" r=".8" opacity=".38"/>
    </g>
    <g transform="translate(946 160)">
      <g transform="rotate(-14)">
        <ellipse rx="246" ry="121" fill="url(#h-corona)"/>
        <g class="h-polar-light">
          <path d="M-4-22 -17-173 Q0-179 15-173 L4-22Z" fill="url(#h-jet)" filter="url(#h-light)"/>
          <path d="M-2-24 -6-158 Q0-162 5-157 L2-24Z" fill="url(#h-jet)"/>
          <path d="M-4 20-13 181Q0 186 16 180L4 20Z" fill="url(#h-counterjet)" filter="url(#h-light)"/>
        </g>
        <g fill="none" stroke="url(#h-disk)" stroke-linecap="round" class="h-disk-light">
          <path d="M-241 15C-168-54 145-65 240 15" stroke-width="14" opacity=".24" filter="url(#h-light)"/>
          <path d="M-235 14C-168-53 146-57 235 14" stroke-width="1.1" opacity=".45"/>
          <path d="M-222 12C-135-39 137-44 224 11" stroke-width="2.1" opacity=".42" filter="url(#h-dust)"/>
          <path d="M-197 9C-129-27 132-35 201 10" stroke-width="1.1" opacity=".42"/>
          <path d="M-168 6C-118-19 117-25 172 6" stroke-width=".8" opacity=".44"/>
        </g>
        <circle r="36" fill="#02040a"/>
        <circle r="36.7" fill="none" stroke="url(#h-horizon)" stroke-width="1.1"/>
        <g fill="none" stroke="url(#h-lens)" stroke-linecap="round">
          <path d="M-68-4C-71-43-35-70 3-70C39-70 74-42 70-5" stroke-width="7" opacity=".26" filter="url(#h-light)"/>
          <path d="M-68-4C-69-44-35-67 3-67C39-67 71-41 70-5" stroke-width="2.3" opacity=".86"/>
          <path d="M-61-9C-54-45-25-59 8-59C38-59 61-35 64-8" stroke-width=".8" opacity=".38"/>
          <path d="M-52 10C-48 43 43 47 55 9" stroke-width="1.2" opacity=".34"/>
        </g>
        <g fill="none" stroke="url(#h-disk)" stroke-linecap="round" class="h-disk-light">
          <path d="M-236 16C-161 54-85 40-4 24C89 5 171-3 234 15" stroke-width="11" opacity=".35" filter="url(#h-light)"/>
          <path d="M-233 16C-159 49-83 37-3 23C88 7 171-1 234 15" stroke-width="3.2" opacity=".91" filter="url(#h-dust)"/>
          <path d="M-235 17C-155 59-62 50 24 31C106 12 177 4 236 17" stroke-width="1.2" opacity=".46"/>
          <path d="M-212 23C-145 66-45 58 36 40C115 21 175 15 217 25" stroke-width=".8" opacity=".28"/>
          <path d="M-196 27C-130 68-40 66 47 44C121 25 167 23 199 30" stroke-width="2.5" opacity=".15" filter="url(#h-feather)"/>
        </g>
      </g>
    </g>
    <rect width="1200" height="320" fill="url(#h-text-field)"/>
    <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
      <text x="80" y="145" fill="#f1f3f7" font-size="58" font-weight="500" letter-spacing="1.2">HELLO, I'M IQ</text>
      <text x="83" y="194" fill="#a8b5c9" font-size="34" font-weight="400" letter-spacing="2.3">NICE TO MEET YOU</text>
    </g>
    <rect x="84" y="214" width="173" height="1" fill="url(#h-rule)"/>
    <rect x=".5" y=".5" width="1199" height="319" rx="23.5" fill="none" stroke="#abb9d0" stroke-opacity=".1"/>
  </g>
</svg>
