<svg xmlns="http://www.w3.org/2000/svg" width="360" height="240" viewBox="0 0 360 240" role="img" aria-labelledby="title description">
  <title id="title">Singulearn — a quiet black hole</title>
  <desc id="description">A dark black hole bends a fine champagne accretion disk into an arch, surrounded by a sparse field of distant blue stars.</desc>
  <defs>
    <radialGradient id="space" cx="51%" cy="49%" r="76%">
      <stop stop-color="#111525"/>
      <stop offset=".49" stop-color="#070b16"/>
      <stop offset="1" stop-color="#040711"/>
    </radialGradient>
    <radialGradient id="haze">
      <stop stop-color="#aaa3d6" stop-opacity=".13"/>
      <stop offset=".38" stop-color="#9cbcd8" stop-opacity=".07"/>
      <stop offset="1" stop-color="#9cbcd8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="disk" x1="45" y1="120" x2="315" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9cbcd8" stop-opacity="0"/>
      <stop offset=".12" stop-color="#9cbcd8" stop-opacity=".27"/>
      <stop offset=".33" stop-color="#b88c62" stop-opacity=".72"/>
      <stop offset=".48" stop-color="#eed9b2"/>
      <stop offset=".61" stop-color="#f5e9d3"/>
      <stop offset=".79" stop-color="#aaa3d6" stop-opacity=".58"/>
      <stop offset="1" stop-color="#9cbcd8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="lens" x1="128" y1="120" x2="232" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#b88c62" stop-opacity=".2"/>
      <stop offset=".25" stop-color="#d7b78f"/>
      <stop offset=".57" stop-color="#f6e9cd"/>
      <stop offset=".84" stop-color="#aaa3d6" stop-opacity=".7"/>
      <stop offset="1" stop-color="#9cbcd8" stop-opacity=".15"/>
    </linearGradient>
    <linearGradient id="photon" x1="140" y1="81" x2="214" y2="160" gradientUnits="userSpaceOnUse">
      <stop stop-color="#b88c62" stop-opacity=".72"/>
      <stop offset=".28" stop-color="#eed9b2" stop-opacity=".93"/>
      <stop offset=".62" stop-color="#aaa3d6" stop-opacity=".62"/>
      <stop offset="1" stop-color="#9cbcd8" stop-opacity=".25"/>
    </linearGradient>
    <filter id="diskBloom" x="-12%" y="-90%" width="124%" height="280%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="lensBloom" x="-20%" y="-25%" width="140%" height="150%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
    <clipPath id="panel"><rect width="360" height="240" rx="19"/></clipPath>
  </defs>
  <style>
    .light { animation: luminosity 18s ease-in-out infinite; }
    @keyframes luminosity { 0%,100% { opacity:.82; } 50% { opacity:1; } }
    @media (prefers-reduced-motion:reduce) { .light { animation:none; } }
  </style>
  <g clip-path="url(#panel)">
    <rect width="360" height="240" fill="url(#space)"/>
    <ellipse cx="180" cy="121" rx="177" ry="99" fill="url(#haze)" transform="rotate(-16 180 121)"/>
    <g fill="#9cbcd8">
      <circle cx="29" cy="32" r=".7" opacity=".49"/>
      <circle cx="48" cy="67" r=".45" opacity=".4"/>
      <circle cx="79" cy="27" r=".45" opacity=".53"/>
      <circle cx="109" cy="47" r=".8" opacity=".53"/>
      <circle cx="152" cy="25" r=".5" opacity=".36"/>
      <circle cx="210" cy="39" r=".55" opacity=".53"/>
      <circle cx="269" cy="25" r=".7" opacity=".59"/>
      <circle cx="322" cy="48" r=".9" opacity=".65"/>
      <circle cx="340" cy="93" r=".45" opacity=".38"/>
      <circle cx="24" cy="115" r=".5" opacity=".37"/>
      <circle cx="62" cy="134" r=".45" opacity=".31"/>
      <circle cx="30" cy="190" r=".75" opacity=".6"/>
      <circle cx="73" cy="214" r=".4" opacity=".45"/>
      <circle cx="107" cy="184" r=".45" opacity=".26"/>
      <circle cx="150" cy="213" r=".7" opacity=".46"/>
      <circle cx="225" cy="194" r=".45" opacity=".27"/>
      <circle cx="266" cy="216" r=".8" opacity=".48"/>
      <circle cx="300" cy="178" r=".5" opacity=".45"/>
      <circle cx="337" cy="207" r=".55" opacity=".4"/>
      <circle cx="291" cy="58" r=".35" opacity=".29"/>
      <circle cx="45" cy="218" r=".35" opacity=".21"/>
      <circle cx="120" cy="16" r=".35" opacity=".2"/>
      <circle cx="331" cy="150" r=".35" opacity=".29"/>
    </g>
    <g transform="rotate(-16 180 120)" fill="none" stroke-linecap="round">
      <!-- A single accretion disk, with its far side hidden by the horizon. -->
      <ellipse class="light" cx="180" cy="120" rx="132" ry="18" stroke="url(#disk)" stroke-width="11" opacity=".35" filter="url(#diskBloom)"/>
      <path d="M48 120 C72 93 286 93 312 120" stroke="url(#disk)" stroke-width="3.4" opacity=".57"/>
      <path d="M43 120 C85 89 275 89 317 120" stroke="url(#disk)" stroke-width=".65" opacity=".27"/>
      <!-- Gravitational lensing lifts the rear disk above the dark silhouette. -->
      <path class="light" d="M130 123 C128 90 148 69 180 69 C211 69 232 91 230 123" stroke="url(#lens)" stroke-width="9" opacity=".36" filter="url(#lensBloom)"/>
      <path d="M130 123 C128 90 148 69 180 69 C211 69 232 91 230 123" stroke="url(#lens)" stroke-width="2.3"/>
      <path d="M134 115 C135 88 154 73 180 73 C207 73 224 91 226 115" stroke="url(#lens)" stroke-width=".7" opacity=".56"/>
      <circle cx="180" cy="120" r="43.2" fill="#010208" stroke="url(#photon)" stroke-width="1.2"/>
      <circle cx="180" cy="120" r="40.5" fill="#010208" stroke="#eed9b2" stroke-opacity=".12" stroke-width=".5"/>
      <!-- Light from the near side passes in front of the horizon. -->
      <path class="light" d="M48 120 C90 137 126 143 180 140 C234 137 279 130 312 120" stroke="url(#disk)" stroke-width="9" opacity=".44" filter="url(#diskBloom)"/>
      <path d="M48 120 C90 137 126 143 180 140 C234 137 279 130 312 120" stroke="url(#disk)" stroke-width="3.2"/>
      <path d="M52 119 C95 130 133 135 181 133 C233 131 276 125 308 119" stroke="url(#disk)" stroke-width="1.15" opacity=".69"/>
      <path d="M56 123 C99 143 136 149 181 146 C230 143 275 134 304 124" stroke="url(#disk)" stroke-width=".7" opacity=".37"/>
      <path d="M79 135 C120 154 156 163 181 162 C208 161 250 148 282 134" stroke="url(#disk)" stroke-width=".5" opacity=".15"/>
    </g>
    <rect x=".5" y=".5" width="359" height="239" rx="18.5" fill="none" stroke="#9cbcd8" stroke-opacity=".15"/>
  </g>
</svg>
